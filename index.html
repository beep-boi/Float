<!DOCTYPE html>

<script src="firebase-config.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getDatabase, ref, onValue, update, get, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  // ==== PASTE YOUR FIREBASE CONFIG BETWEEN THE BRACES BELOW ====
  const firebaseConfig = window.__HISAAB_FIREBASE__ || null;
  // =============================================================

  window.HisaabSync = { ready:false, enabled:false };

  if (firebaseConfig && firebaseConfig.apiKey) {
    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt:'select_account' });

      let curUser = null, dbRef = null, unsub = null;

      const api = {
        ready:true, enabled:true, user:null,
        signIn(){
          signInWithPopup(auth, provider).catch(function(){
            signInWithRedirect(auth, provider);
          });
        },
        signOut(){ if(unsub){unsub();unsub=null;} signOut(auth); },
        push(payload){
          if(!dbRef) return Promise.resolve(false);
          return update(dbRef, payload).then(function(){return true;}).catch(function(){return false;});
        }
      };
      window.HisaabSync = api;

      getRedirectResult(auth).catch(function(){});

      onAuthStateChanged(auth, function(user){
        curUser = user; api.user = user;
        if(window.__hisaabAuthChanged) window.__hisaabAuthChanged(user);
        if(unsub){ unsub(); unsub=null; }
        if(user){
          dbRef = ref(db, 'ledgers/' + user.uid);
          unsub = onValue(dbRef, function(snap){
            var val = snap.val() || {};
            if(window.__hisaabRemote) window.__hisaabRemote(val);
          });
        } else {
          dbRef = null;
        }
      });
    } catch(e){
      window.HisaabSync = { ready:false, enabled:false, error:String(e) };
    }
  }
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  --g1:#F4F0E7; --g2:#F6F2EA; --g3:#EFEAE0;
  --paper:#1B1E28;
  --muted:#7C7565;
  --rule:#DDD5C4;
  --card:#FFFDF8;
  --cardline:#E6DECD;
  --ink:#F4F0E7;
  --ink2:#FFFDF8;
  --ink3:#EAE4D6;
  --brass:#A0710F;
  --verm:#BE3B2B;
  --teal:#2C7A70;
  --wm1:#1B1E28; --wm2:#BE3B2B;
  --pill:#EAE4D6; --pilltx:#7C7565;
  --fab1:#BE3B2B; --fab2:#A2311F;
  --shadow:rgba(90,80,60,.16);
  --soft:0 1px 3px rgba(90,80,60,.1);
  --leaf:0;

  min-height:100vh;color:var(--paper);
  background:var(--g1);
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.4;overflow-x:hidden;padding-bottom:124px;
  -webkit-font-smoothing:antialiased;transition:color .25s ease;
}
body.night{background:#12141B;
  --g1:#12141B; --g2:#14161F; --g3:#101219;
  --paper:#EFEAE1; --muted:#828AA0; --rule:#2E3342;
  --card:#191C26;
  --cardline:#2A2F3D;
  --ink:#12141B; --ink2:#191C26; --ink3:#232734;
  --brass:#E0A93B; --verm:#E2503F; --teal:#46A6A0;
  --wm1:#EFEAE1; --wm2:#E2503F;
  --pill:#191C26; --pilltx:#A9B1C6;
  --fab1:#E2503F; --fab2:#C6402F;
  --shadow:rgba(0,0,0,.5);
  --soft:0 1px 3px rgba(0,0,0,.28);
  --leaf:0;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select{font-family:inherit;color:var(--paper)}
svg{display:block}
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* botanical watermark */
.leaf{position:fixed;top:-26px;right:-52px;width:290px;height:290px;z-index:0;
  pointer-events:none;opacity:var(--leaf);transition:opacity .3s ease}
.leaf svg{width:100%;height:100%}
#app{position:relative;z-index:1}

.hd{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:9px;
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
  background:linear-gradient(180deg,var(--g1) 65%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--rule)}
body.night .hd{background:linear-gradient(180deg,var(--g1) 65%,transparent)}
.hd-name{font-family:'Bodoni Moda',Georgia,serif;font-size:27px;font-weight:700;
  letter-spacing:-.01em;color:var(--paper);display:flex;align-items:baseline}
.hd-name .dot{color:var(--teal);font-size:30px;line-height:1;margin-left:1px}
.hd-sp{flex:1}
.mo{display:flex;align-items:center;background:var(--pill);border-radius:999px;padding:4px}
.mo button{display:flex;padding:5px;border-radius:999px;color:var(--pilltx);opacity:.85}
.mo button:active{opacity:1}
.mo span{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:0 6px;min-width:66px;text-align:center;color:var(--pilltx)}
.ibtn{display:flex;padding:9px;border-radius:999px;color:var(--muted);
  background:var(--card);border:1px solid var(--cardline);box-shadow:var(--soft)}
.ibtn:active{color:var(--paper)}

.wrap{padding:0 18px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--cardline);border-radius:20px;box-shadow:var(--soft)}
.sect{margin-top:26px}
.sect-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}

/* balance hero — centred, per the reference */
.hero{padding:26px 18px 4px}
.hero-lbl2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.hero-num{font-family:'Bodoni Moda',Georgia,serif;font-size:56px;line-height:1;font-weight:500;
  letter-spacing:-.022em;font-variant-numeric:tabular-nums;word-break:break-all;
  color:var(--paper);margin-top:6px}
.hero-num .r{font-size:.6em;margin-right:4px;vertical-align:.1em;color:var(--brass);opacity:.85}
.hero-neg{color:var(--verm)}
.hero-split{display:flex;gap:11px;margin-top:22px;text-align:left}
.split{flex:1;min-width:0;background:var(--card);border:1px solid var(--cardline);
  border-radius:18px;padding:14px 15px;box-shadow:var(--soft)}
.split .k{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.split .v{font-size:20px;font-weight:500;margin-top:5px;word-break:break-all}
/* rents / spend heroes stay left-aligned */
.hero-lbl{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}

.coll{margin-top:16px;padding:16px 17px}
.coll-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;gap:8px}
.coll-top b{font-size:14px;font-weight:600}
.coll-top .n{font-size:12px;color:var(--muted);white-space:nowrap}
.bar{height:8px;border-radius:999px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .45s ease;background:var(--brass)}
.coll-note{margin-top:10px;font-size:11.5px;color:var(--muted)}
.coll-note b{color:var(--brass);font-weight:600}

.ledger{position:relative;background:var(--card);border:1px solid var(--cardline);
  border-radius:20px;padding:2px 16px;box-shadow:var(--soft)}
.ledger:before{content:'';position:absolute;left:62px;top:14px;bottom:14px;width:1px;
  background:var(--verm);opacity:.3}
.row{position:relative;display:flex;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row-d{width:46px;flex-shrink:0;padding-right:12px;text-align:right}
.row-d .dd{font-size:14.5px;font-weight:600;line-height:1.05}
.row-d .mm{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row-b{flex:1;min-width:0;padding-left:14px}
.row-t{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{text-align:right;padding-left:10px;flex-shrink:0}
.row-a{font-size:15px;font-weight:600;white-space:nowrap}
.row-bal{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.in{color:var(--brass)}.out{color:var(--verm)}.mv{color:var(--teal)}
.rowbtns{display:flex;gap:6px;padding-left:8px}
.rowbtns button{display:flex;padding:10px;border-radius:11px;color:var(--muted);
  background:var(--ink3);border:1px solid var(--cardline)}
.rowbtns button:active{color:var(--paper)}

.empty{padding:40px 24px 34px;text-align:center;background:none;
  border:1px dashed var(--rule);border-radius:20px}
.empty h4{font-family:'Bodoni Moda',Georgia,serif;font-size:22px;font-weight:500;margin:0 0 7px;letter-spacing:-.01em}
.empty p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.5}
.empty .cta{margin-top:18px;padding:12px 26px;border-radius:999px;background:none;
  border:1px solid var(--brass);color:var(--brass);font-size:13.5px;font-weight:600}
.empty .cta:active{background:var(--paper);color:var(--ink);border-color:var(--paper)}

.catrow{display:flex;align-items:center;gap:11px;padding:9px 0}
.catrow .nm{width:92px;flex-shrink:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .tk{flex:1;height:9px;background:var(--rule);border-radius:999px;overflow:hidden}
.catrow .tk i{display:block;height:100%;border-radius:999px;background:var(--verm)}
.catrow .vl{width:78px;text-align:right;font-size:12.5px;font-weight:600}

.cols{display:flex;align-items:flex-end;gap:8px;height:130px;padding:12px 2px 0}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.col .pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.col .pair i{width:11px;border-radius:4px 4px 0 0;min-height:2px}
.col .lb{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;gap:14px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px}

.estate{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.estate b{font-family:'Bodoni Moda',Georgia,serif;font-size:24px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.estate .ed{display:flex;padding:9px;border-radius:11px;background:var(--card);
  border:1px solid var(--cardline);color:var(--muted);flex-shrink:0;box-shadow:var(--soft)}
.estate .ed:active{color:var(--paper)}
.estate .hint{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-left:auto;flex-shrink:0;opacity:.7}

.unit{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule)}
.unit:last-child{border-bottom:0}
.unit .tag{width:44px;height:44px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;background:var(--ink3);color:var(--muted)}
.unit .tag.paid{background:rgba(224,169,59,.16);color:var(--brass)}
.unit .bd{flex:1;min-width:0}
.unit .bd b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .bd s{display:block;text-decoration:none;font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .rt{text-align:right;flex-shrink:0}
.unit .rt .a{font-size:14.5px;font-weight:600}
.unit .rt .st{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.paidbtn{flex-shrink:0;padding:10px 15px;border-radius:12px;color:#12141B;
  background:var(--brass);
  font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.paidbtn:active{transform:scale(.95)}
.undobtn{flex-shrink:0;padding:10px 13px;border-radius:13px;background:var(--ink3);
  border:1px solid var(--cardline);color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}

.ptile{padding:17px 18px;margin-bottom:11px}
.ptile .nm{font-size:16px;font-weight:600}
.ptile .grid{display:flex;margin-top:14px}
.ptile .g{flex:1;min-width:0}
.ptile .g+.g{border-left:1px solid var(--rule);padding-left:12px}
.ptile .g:first-child{padding-right:12px}
.ptile .g .k{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ptile .g .v{font-size:18px;font-weight:500;margin-top:5px;word-break:break-all;
  font-family:'Bodoni Moda',Georgia,serif}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:9px 10px calc(11px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--g3) 62%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--rule)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;color:var(--muted)}
.tab.on{color:var(--paper)}
.tab .ic{display:flex;padding:7px 20px;border-radius:999px;transition:background .2s}
.tab.on .ic{background:var(--ink3);color:var(--paper)}
.tab .tl{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:41;
  width:58px;height:58px;border-radius:18px;color:#fff;
  background:var(--fab1);
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(238,91,78,.38)}
.fab:active{transform:scale(.94)}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(60,40,25,.34);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .18s ease}
body.night .scrim{background:rgba(4,8,7,.66)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:96vh;display:flex;flex-direction:column;
  background:linear-gradient(168deg,var(--g1),var(--g2));
  border-top:1px solid var(--cardline);border-radius:26px 26px 0 0;box-shadow:0 -10px 34px var(--shadow)}
.sheet.anim{animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:15px 18px 12px;border-bottom:1px solid var(--rule);flex-shrink:0}
.sheet-hd h3{font-family:'Bodoni Moda',Georgia,serif;font-size:21px;font-weight:500;margin:0;flex:1;letter-spacing:-.01em}
.sheet-top{padding:13px 18px 0;flex-shrink:0}
.sheet-bd{overflow-y:auto;padding:15px 18px 4px;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.sheet-ft{padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);flex-shrink:0}

.seg{display:flex;gap:5px;background:var(--ink3);padding:4px;border-radius:15px;border:1px solid var(--cardline)}
.seg button{flex:1;padding:11px 4px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;box-shadow:var(--soft)}
body.night .seg button.on{background:rgba(255,255,255,.1)}
.seg button.on.t-rent{color:var(--brass)}
.seg button.on.t-expense{color:var(--verm)}
.seg button.on.t-given{color:var(--teal)}
.seg button.on.t-received{color:var(--brass)}

.amt{text-align:center;padding:16px 0 6px}
.amt .n{font-family:'Bodoni Moda',Georgia,serif;font-size:46px;line-height:1;font-weight:500;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amt .n .r{font-size:.56em;opacity:.5;margin-right:4px;vertical-align:.12em}
.amt .n.z{opacity:.22}
.quick{display:flex;justify-content:center;margin-top:9px}
.quick button{padding:8px 17px;border-radius:999px;background:rgba(30,138,94,.1);
  color:var(--brass);font-size:12px;font-weight:700;letter-spacing:.03em}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.pad button{padding:14px 0;border-radius:15px;background:var(--card);border:1px solid var(--cardline);
  font-size:20px;font-weight:500;font-family:'JetBrains Mono',monospace;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--soft)}
.pad button:active{background:var(--ink3);transform:scale(.96)}
.pad button.act{color:var(--muted)}

.fld{margin-bottom:15px}
.fld>label{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:10px 14px;border-radius:999px;background:var(--card);border:1px solid var(--cardline);
  font-size:12.5px;font-weight:500;color:var(--muted);box-shadow:var(--soft)}
.chip.on{background:var(--paper);border-color:transparent;color:var(--ink)}
.chip.add{border:1px dashed var(--rule);background:none;box-shadow:none}

.inp{width:100%;padding:13px 14px;border-radius:14px;background:var(--card);
  border:1px solid var(--cardline);font-size:16px;outline:none;box-shadow:var(--soft)}
.inp:focus{border-color:var(--brass)}
.inp::placeholder{color:var(--muted)}
select.inp{-webkit-appearance:none;appearance:none}

.save{width:100%;padding:17px;border-radius:16px;color:var(--ink);font-size:15px;font-weight:700;
  background:var(--paper)}
.save:disabled{opacity:.32;box-shadow:none}
.save:active:not(:disabled){transform:scale(.985)}

.hintbox{padding:14px 15px;border-radius:16px;background:var(--card);border:1px solid var(--cardline);
  font-size:12px;line-height:1.55;color:var(--muted);box-shadow:var(--soft)}
.hintbox b{color:var(--paper);font-weight:600}

.setrow{display:flex;align-items:center;gap:9px;padding:13px 0;border-bottom:1px solid var(--rule)}
.setrow:last-child{border-bottom:0}
.setrow .bd{flex:1;min-width:0}
.setrow .bd b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow .bd s{display:block;text-decoration:none;font-size:11.5px;color:var(--muted);margin-top:2px}
.setrow .x{display:flex;padding:9px;border-radius:11px;background:var(--ink3);
  border:1px solid var(--cardline);color:var(--muted);flex-shrink:0}

.tgl{width:48px;height:28px;border-radius:999px;background:var(--rule);padding:3px;flex-shrink:0;
  display:flex;transition:background .2s}
.tgl.on{background:var(--teal);justify-content:flex-end}
.tgl i{display:block;width:22px;height:22px;border-radius:999px;background:#fff;box-shadow:var(--soft)}

.cf-scrim{z-index:80}
.cfbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:81;
  width:min(340px,86vw);background:var(--ink2);border:1px solid var(--cardline);
  border-radius:22px;padding:24px 21px 19px;box-shadow:0 14px 44px var(--shadow);
  animation:pop .18s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.cfbox h4{font-family:'Bodoni Moda',Georgia,serif;font-size:20px;font-weight:500;margin:0 0 9px;letter-spacing:-.01em}
.cfbox p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.55}
.cfrow{display:flex;gap:9px}
.cfrow button{flex:1;padding:14px 8px;border-radius:14px;font-size:13.5px;font-weight:600}
.cfno{background:var(--ink3);border:1px solid var(--cardline);color:var(--paper)}
.cfyes{background:var(--verm);color:#fff;font-weight:700}
.cfok{background:var(--brass);color:#12141B;font-weight:700}
.cfok:active{transform:scale(.97)}
.cfyes:active,.cfno:active{transform:scale(.97)}


/* ── wealth ── */
.wsub{display:flex;gap:5px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wsub::-webkit-scrollbar{display:none}
.wsub button{flex:0 0 auto;padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:var(--muted);background:var(--card);border:1px solid var(--cardline)}
.wsub button.on{background:var(--paper);color:var(--ink);border-color:transparent}
.wline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;color:var(--muted)}
.wline:last-child{border-bottom:0}
.wline.grp{font-size:13.5px;font-weight:600;color:var(--paper);padding-top:13px}
.wline.grp .mono{font-weight:600}
.wline span:last-child{white-space:nowrap}
.k2{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.card.best{border-color:var(--brass);box-shadow:0 0 0 1px rgba(224,169,59,.14),var(--soft)}
.crow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule)}
.crow:last-child{border-bottom:0}
.cbd{flex:1;min-width:0}
.cbd b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbd s{display:block;text-decoration:none;font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubar{height:4px;border-radius:999px;background:var(--rule);overflow:hidden;margin-top:7px;max-width:190px}
.ubar i{display:block;height:100%;border-radius:999px}
.crt{text-align:right;flex-shrink:0}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.lrow:last-child{border-bottom:0}
.lrank{width:24px;height:24px;flex-shrink:0;border-radius:8px;background:var(--ink3);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;
  font-family:'JetBrains Mono',monospace}
.lrank.top{background:var(--brass);color:#12141B}
.tab .ic{display:flex;padding:7px 16px;border-radius:999px;transition:background .2s}
.tab .tl{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(154px + env(safe-area-inset-bottom));
  z-index:70;padding:12px 20px;border-radius:999px;color:var(--ink);font-size:13px;font-weight:600;
  background:var(--paper);box-shadow:0 8px 24px var(--shadow);animation:fade .2s ease;white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---- money / date helpers carried over from Float ---- */
function parseD(iso){if(!iso)return null;var p=String(iso).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function todayD(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function clampMonth(d,add,day){var y=d.getFullYear(),m=d.getMonth()+add;
  var max=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day||d.getDate(),max))}
function isoOf(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function rollCard(c){
  if(!c.currentDue)return false;
  var due=parseD(c.currentDue),st=c.currentSt?parseD(c.currentSt):null,t=todayD(),ch=false,g=0;
  while(due<t&&g<240){due=clampMonth(due,1,c.dueDay||due.getDate());
    if(st)st=clampMonth(st,1,c.stDay||st.getDate());ch=true;g++}
  if(ch){c.currentDue=isoOf(due);if(st)c.currentSt=isoOf(st)}
  return ch;
}
function nextDue(c){
  if(c.currentDue)return parseD(c.currentDue);
  var t=todayD(),y=t.getFullYear(),m=t.getMonth();
  var max=new Date(y,m+1,0).getDate();var d=new Date(y,m,Math.min(c.dueDay||1,max));
  if(d<t){m++;max=new Date(y,m+1,0).getDate();d=new Date(y,m,Math.min(c.dueDay||1,max))}
  return d;
}
function nextStatement(c){
  var st=c.currentSt?parseD(c.currentSt):null,t=todayD(),g=0;
  if(!st){var y=t.getFullYear(),m=t.getMonth(),max=new Date(y,m+1,0).getDate();
    st=new Date(y,m,Math.min(c.stDay||1,max))}
  while(st<t&&g<240){st=clampMonth(st,1,c.stDay||st.getDate());g++}
  return st;
}
function daysTo(d){return Math.round((d-todayD())/86400000)}
// A purchase made today lands on the next statement that hasn't been cut yet,
// and is payable on the due date paired with THAT statement. Walk the
// statement/due pair forward together -- never separately, or they drift apart.
function freeInfo(c){
  var t=todayD(),g=0;
  var st=c.currentSt?parseD(c.currentSt):null;
  var due=c.currentDue?parseD(c.currentDue):null;
  if(!st||!due){
    st=nextStatement(c);
    var y=st.getFullYear(),m=st.getMonth();
    var max=new Date(y,m+1,0).getDate();
    due=new Date(y,m,Math.min(c.dueDay||1,max));
    if(due<st)due=clampMonth(due,1,c.dueDay||due.getDate());
  }
  // statement already cut? then today's spend rolls into the following cycle
  while(st<t&&g<240){
    st=clampMonth(st,1,c.stDay||st.getDate());
    due=clampMonth(due,1,c.dueDay||due.getDate());
    g++;
  }
  return {st:st,due:due,days:daysTo(due)};
}
function freeDays(c){return freeInfo(c).days}
function availOf(c){
  // Float stores 'available' directly -- it's what the bank shows you, and the user keeps it accurate.
  // Fall back to computing it only when it was never set.
  return (c.available===undefined||c.available===null||c.available==='')
    ? Math.max(0,(+c.limit||0)-(+c.bill||0)-(+c.unbilled||0))
    : (+c.available||0);
}
function sumBilled(){return W.cards.reduce(function(s,c){return s+(+c.bill||0)},0)}
function sumUnbilled(){return W.cards.reduce(function(s,c){return s+(+c.unbilled||0)},0)}
function sumLimit(){return W.cards.reduce(function(s,c){return s+(+c.limit||0)},0)}
function sumAvail(){return W.cards.reduce(function(s,c){return s+availOf(c)},0)}
function sumBanks(){return W.banks.reduce(function(s,b){return s+(+b.balance||0)},0)}
function goldPurity(k){return k===24?1:k===22?0.916:k===21?0.875:k===18?0.75:(+k||24)/24}
function silverPurity(p){return p===925?0.925:1}
function metalOf(h){return h.metal==='silver'?'silver':'gold'}
function lotValue(h){return metalOf(h)==='silver'
  ? h.grams*silverPurity(+h.karat||999)*W.silverRate
  : h.grams*goldPurity(+h.karat||24)*W.goldRate}
function lotCost(h){return h.grams*(+h.purchaseRate||0)}
function liveLots(metal){return W.metals.filter(function(h){return metalOf(h)===metal&&h.grams>0})}
function metalValue(metal){return liveLots(metal).reduce(function(s,h){return s+lotValue(h)},0)}
function sumRecv(){return W.receivables.reduce(function(s,r){return s+(+r.amount||0)},0)}
// Money currently owed by whoever funds the household (e.g. Mom), read live off the Hisaab ledger.
// Only counts when the pool is negative -- i.e. more has been spent than has come in, so someone
// is carrying it. A positive pool is unspent cash in hand, not a debt, so it's left out of this.
function liveMomOwed(){var pool=computeBalances().pool;return pool<0?-pool:0}
function sumLiab(){return W.liabilities.reduce(function(s,l){return s+(+l.amount||0)},0)}
function realisedPnl(metal){return W.sales.filter(function(x){return metalOf(x)===metal})
  .reduce(function(s,x){return s+(+x.pnl||0)},0)}
function netWorth(){
  var assets=sumBanks()+metalValue('gold')+metalValue('silver')+sumRecv()+liveMomOwed();
  var liab=sumBilled()+sumUnbilled()+sumLiab();
  return {assets:assets,liab:liab,nw:assets-liab};
}

var SYNC={on:false,user:null,busy:false,applying:false,lastAt:0,sawWealth:false};

function syncAvailable(){return !!(window.HisaabSync&&window.HisaabSync.enabled)}

// merge a remote snapshot into local state, entry-by-entry, newest field wins by ts
// tombstones we know about locally, so a deletion is never resurrected by an old push
var TOMB=load('hisaab:tomb',{});   // { id: _m }
function saveTomb(){store('hisaab:tomb',TOMB)}

// recently-deleted bin: entries stay recoverable for a week
var TRASH_DAYS=7, TRASH_MS=TRASH_DAYS*86400000;
var TRASH=load('hisaab:trash',[]);
function saveTrash(){store('hisaab:trash',TRASH)}
function tooOld(t){return !t||(Date.now()-t)>TRASH_MS}
function pruneTrash(){
  var before=TRASH.length;
  TRASH=TRASH.filter(function(e){return !tooOld(e._delAt)});
  if(TRASH.length!==before)saveTrash();
}

function trashEntry(id){
  var e=null;S.entries.forEach(function(x){if(x.id===id)e=x});
  var now=Date.now();
  TOMB[id]=now;
  if(e){var c={};for(var k in e)c[k]=e[k];c._delAt=now;c._m=now;TRASH.push(c);}
  S.entries=S.entries.filter(function(x){return x.id!==id});
  saveTomb();saveTrash();
  if(SYNC.on&&syncAvailable()&&SYNC.user&&e){
    var d={};for(var k2 in e)d[k2]=e[k2];
    d._deleted=true;d._delAt=now;d._m=now;
    var o={};o['entries/'+id]=d;window.HisaabSync.push(o);
  }
}

function restoreEntry(id){
  var e=null;TRASH.forEach(function(x){if(x.id===id)e=x});
  if(!e)return false;
  TRASH=TRASH.filter(function(x){return x.id!==id});
  delete TOMB[id];
  var c={};for(var k in e)c[k]=e[k];
  delete c._delAt;delete c._deleted;c._m=Date.now();
  S.entries.push(c);
  saveTomb();saveTrash();saveEnt();
  return true;
}

function purgeEntry(id){
  TRASH=TRASH.filter(function(x){return x.id!==id});
  TOMB[id]=Date.now();
  saveTrash();saveTomb();
  if(SYNC.on&&syncAvailable()&&SYNC.user){
    var o={};o['entries/'+id]={_deleted:true,_m:TOMB[id],_purged:true};
    window.HisaabSync.push(o);
  }
}

function mergeRemote(remote){
  if(!remote)return false;
  var changed=false;
  var rEnt=remote.entries||{};
  var byId={};S.entries.forEach(function(e){byId[e.id]=e});
  var inTrash={};TRASH.forEach(function(e){inTrash[e.id]=e});
  Object.keys(rEnt).forEach(function(id){
    var re=rEnt[id]; if(!re)return;
    if(re._deleted){
      if(!TOMB[id]||(re._m||0)>TOMB[id]){TOMB[id]=re._m||Date.now();changed=true;}
      if(byId[id]){S.entries=S.entries.filter(function(e){return e.id!==id});changed=true;}
      if(re._purged){
        if(inTrash[id]){TRASH=TRASH.filter(function(e){return e.id!==id});changed=true;}
      }else if(!inTrash[id]&&re.type&&!tooOld(re._delAt)){
        var c={};for(var k in re)c[k]=re[k];delete c._deleted;
        TRASH.push(c);changed=true;
      }
      return;
    }
    // a live record newer than our tombstone means it was restored on the other phone
    if(TOMB[id]&&TOMB[id]>=(re._m||0))return;
    if(TOMB[id]){
      delete TOMB[id];
      if(inTrash[id])TRASH=TRASH.filter(function(e){return e.id!==id});
      changed=true;
    }
    var le=byId[id];
    if(!le){ S.entries.push(re);changed=true; }
    else if((re._m||0)>(le._m||0)){ for(var k2 in re)le[k2]=re[k2];changed=true; }
  });
  if(remote.wealth)SYNC.sawWealth=true;
  if(remote.wealth&&(remote.wealth._m||0)>((W._m)||0)){
    var rw=remote.wealth;
    W={cards:rw.cards||[],banks:rw.banks||[],metals:rw.metals||[],
       goldRate:+rw.goldRate||W.goldRate,silverRate:+rw.silverRate||W.silverRate,
       liabilities:rw.liabilities||[],receivables:rw.receivables||[],sales:rw.sales||[],_m:rw._m||0};
    store(K_W,W);changed=true;
  }
  if(remote.config&&(remote.config._m||0)>((S.cfg._m)||0)){
    var cf=remote.config;
    S.cfg={people:cf.people||S.cfg.people,categories:cf.categories||S.cfg.categories,
      properties:cf.properties||S.cfg.properties,givenIsSpend:!!cf.givenIsSpend,_m:cf._m||0};
    changed=true;
  }
  if(changed){store(K_ENT,S.entries);store(K_CFG,S.cfg);saveTomb();saveTrash();}
  return changed;
}

function remoteHandler(val){

var pushTimer=null;
function syncPush(){
  if(!SYNC.on||SYNC.applying||!syncAvailable()||!SYNC.user)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(doPush,300);
}
function doPush(){
  if(!SYNC.on||!syncAvailable()||!SYNC.user)return;
  var now=Date.now();
  var payload={};
  // write each live entry at its own path (never blows away others' entries)
  S.entries.forEach(function(e){ if(!e._m)e._m=now; payload['entries/'+e.id]=e; });
  // re-assert deletions so a peer's stale copy stays dead; trashed ones keep their data
  var trashById={};TRASH.forEach(function(e){trashById[e.id]=e});
  Object.keys(TOMB).forEach(function(id){
    var t=trashById[id];
    if(t){var d={};for(var k in t)d[k]=t[k];d._deleted=true;d._m=TOMB[id];payload['entries/'+id]=d;}
    else payload['entries/'+id]={_deleted:true,_m:TOMB[id],_purged:true};
  });
  payload['config']={people:S.cfg.people,categories:S.cfg.categories,properties:S.cfg.properties,
    givenIsSpend:!!S.cfg.givenIsSpend,_m:S.cfg._m||now};
  if((W._m||0)>1||!SYNC.sawWealth){
    payload['wealth']={cards:W.cards,banks:W.banks,metals:W.metals,goldRate:W.goldRate,
      silverRate:W.silverRate,liabilities:W.liabilities,receivables:W.receivables,
      sales:W.sales,_m:W._m||1};
  }
  store(K_ENT,S.entries);store(K_CFG,S.cfg);
  window.HisaabSync.push(payload);
}

function syncStart(){
  if(!syncAvailable())return;
  window.__hisaabRemote=remoteHandler;
  window.__hisaabAuthChanged=function(user){
    SYNC.user=user; SYNC.on=!!user;
    store('hisaab:sync', !!user);
    if(user){ setTimeout(doPush,800); }  // seed cloud with local data on first sign-in
    renderOverlay(false);
  };
  if(window.HisaabSync.user){SYNC.user=window.HisaabSync.user;SYNC.on=true;}
}

function viewSpend(){
  var all=sortedEntries();
  var mo=all.filter(function(e){return mKey(e.date)===S.month&&e.type==='expense'});
  var total=mo.reduce(function(s,e){return s+e.amount},0);
  var cm={};mo.forEach(function(e){var k=e.category||'Uncategorised';cm[k]=(cm[k]||0)+e.amount});
  var cats=Object.keys(cm).map(function(k){return[k,cm[k]]}).sort(function(a,b){return b[1]-a[1]});
  var top=cats.length?cats[0][1]:1;
  var keys=[],k=S.month;for(var i=0;i<6;i++){keys.unshift(k);k=shiftM(k,-1)}
  var months=keys.map(function(key){var set=all.filter(function(e){return mKey(e.date)===key});
    return{key:key,inn:sumType(set,'rent')+sumType(set,'received'),out:sumType(set,'expense')+(S.cfg.givenIsSpend?sumType(set,'given'):0)}});
  var peak=1;months.forEach(function(m){peak=Math.max(peak,m.inn,m.out)});

  var h='<div class="wrap" style="padding-top:20px">'
   +'<div class="hero-lbl"><span class="eyebrow">Spent \u00b7 '+esc(mLabel(S.month))+'</span></div>'
   +'<div class="hero-num out" style="font-size:42px"><span class="r">\u20b9</span>'+inr(total)+'</div>'
   +'<div class="mono" style="font-size:12.5px;color:var(--muted);margin-top:8px">'+mo.length
   +(mo.length===1?' entry':' entries')+(mo.length>0?' \u00b7 \u20b9'+inr(total/daysIn(S.month))+' a day':'')+'</div>';

  h+='<div class="sect"><div class="sect-hd"><span class="eyebrow">In and out \u00b7 last 6 months</span></div>'
   +'<div class="card" style="padding:10px 14px 14px"><div class="cols">';
  months.forEach(function(m){h+='<div class="col"><div class="pair">'
   +'<i style="height:'+((m.inn/peak)*100).toFixed(1)+'%;background:var(--brass)"></i>'
   +'<i style="height:'+((m.out/peak)*100).toFixed(1)+'%;background:var(--verm)"></i></div>'
   +'<span class="lb">'+esc(MON[+m.key.slice(5,7)-1])+'</span></div>'});
  h+='</div><div class="legend"><span><i style="background:var(--brass)"></i>Rent in</span>'
   +'<span><i style="background:var(--verm)"></i>Spent out</span></div></div></div>';

  h+='<div class="sect"><div class="sect-hd"><span class="eyebrow">Where it went</span></div>';
  if(!cats.length){h+=emptyBox('Nothing spent this month',"Or you just haven't written it down yet.",'add-expense')}
  else{h+='<div class="card" style="padding:8px 15px 12px">';
    cats.forEach(function(c){h+='<div class="catrow"><span class="nm">'+esc(c[0])+'</span>'
      +'<span class="tk"><i style="width:'+((c[1]/top)*100).toFixed(1)+'%"></i></span>'
      +'<span class="vl mono">\u20b9'+inr(c[1])+'</span></div>'});
    h+='</div>'}
  h+='</div>';

  if(mo.length)h+='<div class="sect"><div class="sect-hd"><span class="eyebrow">Every expense this month</span></div>'
   +'<div class="ledger">'+mo.slice().reverse().map(function(e){return ledgerRow(e)}).join('')+'</div></div>';
  h+='</div>';return h}

function viewGiven(){
  var all=sortedEntries();

   +(S.cfg.givenIsSpend?'<b>Given counts as spend.</b> Handing over cash lowers the balance right away, so don\u2019t log the same money again as an expense.'
     :'<b>Given doesn\u2019t change the balance.</b> The cash has only changed hands. The balance drops when it\u2019s logged as an expense \u2014 so nothing gets counted twice.')
   +' <b>Received always adds to the balance</b> \u2014 use it whenever real money comes in from outside the two of you, like a top-up from your mum, and it\u2019ll offset your logged spending automatically.'
   +'</div>';

  h+='<div class="sect"><div class="sect-hd"><span class="eyebrow">Every handover</span></div>'
   +(list.length===0?emptyBox('No money handed over yet','Log it when you pass cash to each other.','add-given')
     :'<div class="ledger">'+list.map(function(e){return ledgerRow(e)}).join('')+'</div>')
   +'</div></div>';return h}

     +wStat('Unrealised',(pnl>=0?'+':'\u2212')+'\u20b9'+inr(pnl),pnl>=0?'in':'out')
     +(real?wStat('Booked',(real>=0?'+':'\u2212')+'\u20b9'+inr(real),real>=0?'in':'out'):'')

     +'<button class="chip add" style="flex:1;padding:13px" data-a="w-lot-new" data-v="'+m+'">+ Add '+m+'</button>'

function cardRecalc(src){
  function n(id){var e=document.getElementById(id);return e?numOf(e.value):0}
  function set(id,v){var e=document.getElementById(id);if(e)e.value=v}
  var limit=n('wf-limit'),bill=n('wf-bill'),unb=n('wf-unbilled'),av=n('wf-avail');
  var warn=document.getElementById('wf-calcwarn'),msg='';
  if(src==='avail'){
    var newUnb=limit-bill-av;
    set('wf-unbilled',Math.max(0,Math.round(newUnb)));
    if(newUnb<0)msg='Available plus bill is more than the limit. Unbilled shown as \u20b90 \u2014 it\u2019ll still save.';
  }else{
    var newAv=limit-bill-unb;
    set('wf-avail',Math.max(0,Math.round(newAv)));
    if(newAv<0)msg='Bill plus unbilled is more than the limit. Available shown as \u20b90 \u2014 it\u2019ll still save.';
  }
  if(warn){warn.textContent=msg;warn.style.display=msg?'':'none'}
}

function wF(label,id,v,type,ph){
  var t=type==='date'?'date':'text';
  var im=type==='num'?' inputmode="numeric"':'';
  var cls=(type==='num'||type==='date')?'inp mono':'inp';
  var hook='';
  if(id==='wf-limit'||id==='wf-bill'||id==='wf-unbilled')hook=' data-recalc="parts"';
  if(id==='wf-avail')hook=' data-recalc="avail"';
  return '<div class="fld"><label>'+esc(label)+'</label>'
   +'<input class="'+cls+'" id="'+id+'" type="'+t+'"'+im+hook+' placeholder="'+esc(ph||'')+'" value="'+esc(v==null?'':v)+'"></div>';
}

function wSave(){
  var k=S.wSheet.kind,id=S.wSheet.id,isNew=!id;
  if(k==='card'){
    var nm=val('wf-name'); if(!nm){ping('Give the card a name');return}
    var o=isNew?{id:wid(W.cards)}:wFind(W.cards,id);
    o.name=nm;o.bank=val('wf-bank');o.limit=numOf(val('wf-limit'));
    o.bill=numOf(val('wf-bill'));o.unbilled=numOf(val('wf-unbilled'));
    o.stDay=numOf(val('wf-stDay'))||1;o.dueDay=numOf(val('wf-dueDay'))||1;
    o.currentSt=val('wf-currentSt')||null;o.currentDue=val('wf-currentDue')||null;
    var av=val('wf-avail');
    o.available=av===''?Math.max(0,o.limit-o.bill-o.unbilled):numOf(av);
    if(isNew)W.cards.push(o);
  }
  else if(k==='bank'){
    var bn=val('wf-name'); if(!bn){ping('Give the account a name');return}
    var b=isNew?{id:wid(W.banks)}:wFind(W.banks,id);
    b.name=bn;b.balance=numOf(val('wf-balance'));
    if(isNew)W.banks.push(b);
  }
  else if(k==='lot'){
    var g=parseFloat(val('wf-grams'))||0; if(!g){ping('How many grams?');return}
    var l=isNew?{id:wid(W.metals)}:wFind(W.metals,id);
    l.metal=S.wSheet.metal||l.metal||'gold';
    l.grams=gm(g);l.karat=numOf(val('wf-karat'))||(l.metal==='silver'?999:24);
    l.purchaseRate=parseFloat(val('wf-purchaseRate'))||0;
    l.date=val('wf-date')||todayISO();l.source=val('wf-source');l.brand=val('wf-brand');
    l.payCard=val('wf-payCard');l.status=S.wSheet.status||l.status||'delivered';l.note=val('wf-note');
    if(isNew)W.metals.push(l);
  }
  else if(k==='sale'){
    var lot=wFind(W.metals,S.wSheet.lotId);
    if(!lot){ping('Pick a holding first');return}
    var sg=parseFloat(val('wf-grams'))||0;
    if(!sg){ping('How many grams sold?');return}
    if(sg>lot.grams+0.0001){ping('That\u2019s more than the holding has');return}
    var rate=parseFloat(val('wf-sellRate'))||0;
    if(!rate){ping('What was the sell rate?');return}
    var proceeds=sg*rate, basis=sg*(+lot.purchaseRate||0);
    var snap={};for(var kk in lot)snap[kk]=lot[kk];
    W.sales.push({id:wid(W.sales),metal:metalOf(lot),karat:lot.karat,brand:lot.brand,source:lot.source,
      buyer:val('wf-buyer'),date:val('wf-date')||todayISO(),grams:gm(sg),buyRate:lot.purchaseRate,
      sellRate:rate,proceeds:Math.round(proceeds),costBasis:Math.round(basis),
      pnl:Math.round(proceeds-basis),lotId:lot.id,lotSnap:snap});
    lot.grams=gm(lot.grams-sg);
  }
  else{
    var list=k==='recv'?W.receivables:W.liabilities;
    var pn=val('wf-name'); if(!pn){ping('Add a name');return}
    var e=isNew?{id:wid(list)}:wFind(list,id);
    e.name=pn;e.amount=numOf(val('wf-amount'));e.date=val('wf-date')||null;e.note=val('wf-note');
    if(isNew)list.push(e);
  }
  saveW();S.wSheet=null;renderOverlay(false);renderApp();
  ping(isNew?'Added':'Saved');
}

function markBillPaid(id){
  var c=wFind(W.cards,id); if(!c||!(+c.bill))return;
  c.available=Math.min(+c.limit||0,availOf(c)+(+c.bill||0));
  c.bill=0;
  saveW();renderApp();ping('Bill cleared \u00b7 limit freed up');
}

function wDelete(kind,id){
  if(kind==='card')W.cards=W.cards.filter(function(x){return String(x.id)!==String(id)});
  else if(kind==='bank')W.banks=W.banks.filter(function(x){return String(x.id)!==String(id)});
  else if(kind==='lot')W.metals=W.metals.filter(function(x){return String(x.id)!==String(id)});
  else if(kind==='sale'){
    var sale=wFind(W.sales,id);
    if(sale){var lot=wFind(W.metals,sale.lotId);
      if(lot)lot.grams=gm(lot.grams+(+sale.grams||0));}
    W.sales=W.sales.filter(function(x){return String(x.id)!==String(id)});
  }
  else if(kind==='recv')W.receivables=W.receivables.filter(function(x){return String(x.id)!==String(id)});
  else if(kind==='liab')W.liabilities=W.liabilities.filter(function(x){return String(x.id)!==String(id)});
  saveW();S.wSheet=null;renderOverlay(false);renderApp();ping('Deleted');
}

function wealthAction(a,v){
  if(a==='w-sub'){S.wsub=v;window.scrollTo(0,0);renderApp();return}
  if(a==='w-close'){S.wSheet=null;renderOverlay(false);return}
  if(a==='w-save'){wSave();return}
  if(a==='w-metal'){S.wSheet.metal=v;renderOverlay(false);return}
  if(a==='w-status'){S.wSheet.status=v;
    var box=document.querySelector('[data-grp="wstatus"]');
    if(box)Array.prototype.forEach.call(box.querySelectorAll('.chip'),function(c){
      if(c.getAttribute('data-v')===v)c.classList.add('on');else c.classList.remove('on')});
    return}
  if(a==='w-del'){var q=v.split('|');
    S.confirm={title:'Delete this?',msg:'This can\u2019t be undone from the bin \u2014 the recovery bin only covers ledger entries.',
      act:'w-del',val:v,label:'Delete'};renderOverlay(false);return}
  if(a==='w-bill-paid'){var pc=wFind(W.cards,v);
    if(pc)S.confirm={title:'Mark this bill paid?',

function syncChips(grp,value){

function doConfirmed(c){
  if(c.act==='row-del'){
    trashEntry(c.val);S.openRow=null;saveEnt();renderAll();ping('Moved to Recently deleted');
  }else if(c.act==='unit-undo'){
    trashEntry(c.val);saveEnt();renderAll();ping('Rent entry removed');
  }else if(c.act==='us-del'){
    var z=c.val.split('|');
    S.cfg.properties.forEach(function(p){if(p.id===z[0])p.units=(p.units||[]).filter(function(u){return u.id!==z[1]})});
    saveCfg();S.unitSheet=null;renderOverlay(false);renderApp();ping('Unit deleted');
  }else if(c.act==='ps-del'){
    S.cfg.properties=S.cfg.properties.filter(function(p){return p.id!==c.val});
    saveCfg();S.propSheet=null;renderOverlay(false);renderApp();ping('Estate deleted');
  }else if(c.act==='w-bill-paid'){
    markBillPaid(c.val);
  }else if(c.act==='w-del'){
    var q=c.val.split('|');wDelete(q[0],q[1]);
  }else if(c.act==='trash-purge'){
    purgeEntry(c.val);renderOverlay(false);ping('Deleted for good');
  }else if(c.act==='trash-empty'){
    TRASH.slice().forEach(function(e){purgeEntry(e.id)});
    renderOverlay(false);ping('Bin emptied');
  }
}

    +(S.confirm?confirmView():'');
  var sc2=overlay.querySelector('.sheet-bd');
  if(sc2&&top&&!animate)sc2.scrollTop=top}

function renderToast(){
  if(toastEl){toastEl.remove();toastEl=null}
  if(!S.toast)return;
  toastEl=document.createElement('div');
  toastEl.className='toast';toastEl.textContent=S.toast;
  document.body.appendChild(toastEl)}

function applyTheme(){
  if(S.light)document.body.classList.remove('night');else document.body.classList.add('night');
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',S.light?'#F4F0E7':'#12141B')}

function renderAll(){renderApp();renderOverlay(false)}

/* ---------------------------- actions ------------------------------ */
function openSheet(type,seed,editEntry){
  var first=allUnits()[0];
  var unitId=(editEntry&&editEntry.unitId)||(seed&&seed.unitId)||(first?first.id:'');
  var amt=editEntry?String(editEntry.amount):'';
  if(!editEntry&&type==='rent'&&unitId){
    var pu=findUnit(unitId);
    if(pu&&Number(pu.rent)>0)amt=String(pu.rent);
  }
  S.sheet={
    type:type,
    edit:!!editEntry,editId:editEntry?editEntry.id:null,
    seedFrom:seed?seed.id:null,
    amt:amt,
    person:(editEntry&&editEntry.person)||(seed&&seed.person)||S.cfg.people[0]||'',
    cat:(editEntry&&editEntry.category)||(seed&&seed.category)||'',
    mode:(editEntry&&editEntry.mode)||(seed&&seed.mode)||'Cash',
    date:editEntry?editEntry.date:todayISO(),
    note:(editEntry&&editEntry.note)||(seed&&seed.note)||'',
    unitId:unitId,
    newCat:false
  };
  S.setup=false;S.propSheet=null;S.unitSheet=null;
  renderOverlay(true)}

function commitEntry(){
  var sh=S.sheet,val=Number(sh.amt);
  if(!val)return;
  var u=sh.type==='rent'?findUnit(sh.unitId):null;
  if(sh.type==='rent'&&!u)return;
  var rec={
    type:sh.type,amount:val,date:sh.date||todayISO(),mode:sh.mode,note:(sh.note||'').trim(),
    person:sh.person,
    category:sh.type==='expense'?(sh.cat||'Uncategorised'):null,
    unitId:sh.type==='rent'?sh.unitId:null,
    unitLabel:sh.type==='rent'?u.label:null,
    tenant:sh.type==='rent'?u.tenant:null,
    propName:sh.type==='rent'?u.propName:null
  };
  if(sh.edit){
    S.entries.forEach(function(e){if(e.id===sh.editId){for(var k in rec)e[k]=rec[k];e._m=Date.now();}});
  }else{
    rec.id=uid();rec.ts=Date.now();rec._m=Date.now();S.entries.push(rec);
  }
  var was=sh.edit;
  saveEnt();S.sheet=null;S.openRow=null;
  renderAll();
  ping(was?'Entry updated':(rec.type==='rent'?'Rent recorded':rec.type==='given'?'Money given recorded':rec.type==='received'?'Money received recorded':'Expense recorded'))}

function markPaid(unitId){
  var u=findUnit(unitId);if(!u)return;
  var amt=Number(u.rent)||0;if(!amt)return;
  var d=new Date(),iso;
  if(mKey(todayISO())===S.month)iso=todayISO();
  else iso=S.month+'-'+pad2(Math.min(new Date().getDate(),daysIn(S.month)));
  S.entries.push({id:uid(),ts:Date.now(),_m:Date.now(),type:'rent',amount:amt,date:iso,mode:'Cash',note:'',
    person:S.cfg.people[0]||'',category:null,unitId:u.id,unitLabel:u.label,tenant:u.tenant,propName:u.propName});
  saveEnt();renderAll();ping(u.label+' \u00b7 \u20b9'+inr(amt)+' received')}

function val(id){var e=document.getElementById(id);return e?e.value.trim():''}

function exportFile(){
  var data={app:'float',version:3,exportedAt:new Date().toISOString(),config:S.cfg,entries:S.entries,wealth:W};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='float-'+todayISO()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
  ping('Backup file saved')}

function importFile(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.entries)){ping('That file isn\u2019t a Float backup');return}
      var seen={};S.entries.forEach(function(e){seen[e.id]=true});
      var added=0;
      d.entries.forEach(function(e){if(e&&e.id&&!seen[e.id]){S.entries.push(e);seen[e.id]=true;added++}});
      if(d.config){var c=d.config;
        (c.people||[]).forEach(function(p){if(S.cfg.people.indexOf(p)<0)S.cfg.people.push(p)});
        (c.categories||[]).forEach(function(x){if(S.cfg.categories.indexOf(x)<0)S.cfg.categories.push(x)});
        var have={};S.cfg.properties.forEach(function(p){have[p.id]=p});
        (c.properties||[]).forEach(function(p){
          if(!have[p.id]){S.cfg.properties.push(p)}
          else{var ex={};(have[p.id].units||[]).forEach(function(u){ex[u.id]=true});
            (p.units||[]).forEach(function(u){if(!ex[u.id])have[p.id].units.push(u)})}})}
      if(d.wealth&&d.wealth.cards){W=d.wealth;W._m=Date.now();store(K_W,W)}
      saveEnt();saveCfg();renderAll();
      ping(added+(added===1?' entry added':' entries added'));
    }catch(err){ping('Couldn\u2019t read that file')}};
  r.readAsText(file)}

document.addEventListener('click',function(ev){
  var el=ev.target.closest?ev.target.closest('[data-a]'):null;
  if(!el)return;
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v');
  if(a.indexOf('w-')===0){wealthAction(a,v);return}

  switch(a){
    case 'theme': S.light=!S.light;store(K_THEME,S.light);applyTheme();break;
    case 'month': S.month=shiftM(S.month,+v);S.openRow=null;renderApp();break;
    case 'tab': S.tab=v;S.openRow=null;window.scrollTo(0,0);renderApp();break;
    case 'setup-open': S.setup=true;S.sheet=null;renderOverlay(true);break;
    case 'setup-close': S.setup=false;renderOverlay(false);renderApp();break;

    case 'add-expense': openSheet('expense',null,null);break;
    case 'add-rent': openSheet('rent',null,null);break;
    case 'add-given': openSheet('given',null,null);break;
    case 'add-received': openSheet('received',null,null);break;
    case 'sheet-close': S.sheet=null;renderOverlay(false);break;
    case 'sheet-type':
      S.sheet.type=v;
      if(v==='rent'&&!S.sheet.amt){var uu=findUnit(S.sheet.unitId);if(uu&&Number(uu.rent)>0)S.sheet.amt=String(uu.rent)}
      renderOverlay(false);break;

    case 'pad':
      if(v==='del')S.sheet.amt=S.sheet.amt.slice(0,-1);
      else if(v==='00'){if(S.sheet.amt&&S.sheet.amt.length<9)S.sheet.amt+='00'}
      else if(S.sheet.amt.length<9)S.sheet.amt=(S.sheet.amt==='0'?v:S.sheet.amt+v);
      syncAmount();break;

    case 'fullrent': S.sheet.amt=String(v);syncAmount();break;
    case 'person': S.sheet.person=v;syncChips('person',v);break;
    case 'mode': S.sheet.mode=v;syncChips('mode',v);break;
    case 'cat': S.sheet.cat=(S.sheet.cat===v?'':v);syncChips('cat',S.sheet.cat);break;
    case 'newcat-toggle': S.sheet.newCat=!S.sheet.newCat;renderOverlay(false);break;
    case 'newcat-add': {
      var nc=val('newcat');
      if(nc){if(S.cfg.categories.indexOf(nc)<0){S.cfg.categories.push(nc);saveCfg()}S.sheet.cat=nc}
      S.sheet.newCat=false;renderOverlay(false);break}
    case 'save': commitEntry();break;

    case 'row-toggle': S.openRow=(S.openRow===v?null:v);renderApp();break;
    case 'row-edit': {
      var t=null;S.entries.forEach(function(e){if(e.id===v)t=e});
      S.openRow=null;renderApp();
      if(t)openSheet(t.type,null,t);
      break}
    case 'row-clone': {
      var s=null;S.entries.forEach(function(e){if(e.id===v)s=e});
      S.openRow=null;renderApp();
      if(s)openSheet(s.type,s,null);
      break}
    case 'row-del':
      S.confirm={title:'Delete this entry?',msg:'It moves to Recently deleted for '+TRASH_DAYS+' days, so you can put it back if this was a mistake.',act:'row-del',val:v,label:'Delete'};
      renderOverlay(false);break;

    case 'unit-paid': markPaid(v);break;
    case 'unit-undo':
      S.confirm={title:'Remove this rent entry?',msg:'It moves to Recently deleted for '+TRASH_DAYS+' days, so you can put it back.',act:'unit-undo',val:v,label:'Remove'};
      renderOverlay(false);break;
    case 'unit-enter': openSheet('rent',{unitId:v},null);break;

    case 'prop-new': S.propSheet={id:null};renderOverlay(true);break;
    case 'prop-open-edit': S.propSheet={id:v};renderOverlay(true);break;
    case 'ps-close': S.propSheet=null;renderOverlay(false);break;
    case 'ps-save': {var nm=val('ps-name');
      if(!nm){ping('Give the estate a name');break}
      if(v){S.cfg.properties.forEach(function(p){if(p.id===v)p.name=nm});
        S.entries.forEach(function(e){if(e.type==='rent'&&e.unitId&&findUnit(e.unitId)&&findUnit(e.unitId).propId===v)e.propName=nm});saveEnt()}
      else{S.cfg.properties.push({id:uid(),name:nm,units:[]})}
      saveCfg();S.propSheet=null;renderOverlay(false);renderApp();ping(v?'Estate renamed':'Estate added');break}
    case 'ps-del':
      S.confirm={title:'Delete this estate?',msg:'The estate and all its units are removed. Payments already recorded stay in your ledger.',act:'ps-del',val:v,label:'Delete'};
      renderOverlay(false);break;

    case 'unit-new': S.unitSheet={propId:v,unitId:null};renderOverlay(true);break;
    case 'unit-open': {var o=v.split('|');S.unitSheet={propId:o[0],unitId:o[1]};renderOverlay(true);break}
    case 'us-close': S.unitSheet=null;renderOverlay(false);break;
    case 'us-save': {var w=v.split('|'),lb=val('us-label');
      if(!lb){ping('Give the unit a number');break}
      var tn=val('us-tenant'),rt=numOf(val('us-rent'));
      S.cfg.properties.forEach(function(p){
        if(p.id!==w[0])return;
        p.units=p.units||[];
        if(w[1]){p.units.forEach(function(u){if(u.id===w[1]){u.label=lb;u.tenant=tn;u.rent=rt}})}
        else{p.units.push({id:uid(),label:lb,tenant:tn,rent:rt})}
      });
      // keep already-recorded payments showing the corrected names
      if(w[1]){var pn2=findProp(w[0]);
        S.entries.forEach(function(e){if(e.type==='rent'&&e.unitId===w[1]){
          e.unitLabel=lb;e.tenant=tn;if(pn2)e.propName=pn2.name}});
        saveEnt()}
      saveCfg();S.unitSheet=null;renderOverlay(false);renderApp();ping(w[1]?'Unit updated':'Unit added');break}
    case 'us-del':
      S.confirm={title:'Delete this unit?',msg:'The unit is removed from the estate. Rent payments already recorded stay in your ledger.',act:'us-del',val:v,label:'Delete'};
      renderOverlay(false);break;

    case 'person-add': {var pnm=val('person-name');
      if(pnm&&S.cfg.people.indexOf(pnm)<0){S.cfg.people.push(pnm);saveCfg()}
      renderOverlay(false);break}
    case 'person-del':
      if(S.cfg.people.length>1){S.cfg.people=S.cfg.people.filter(function(p){return p!==v});saveCfg()}
      renderOverlay(false);break;
    case 'cat-add': {var cnm=val('cat-name');
      if(cnm&&S.cfg.categories.indexOf(cnm)<0){S.cfg.categories.push(cnm);saveCfg()}
      renderOverlay(false);break}
    case 'cat-del':
      S.cfg.categories=S.cfg.categories.filter(function(c){return c!==v});
      saveCfg();renderOverlay(false);break;
    case 'toggle-given': S.cfg.givenIsSpend=!S.cfg.givenIsSpend;saveCfg();renderOverlay(false);renderApp();break;

    case 'sync-in': if(syncAvailable()){window.HisaabSync.signIn();ping('Opening Google sign-in\u2026');}break;
    case 'sync-out': if(syncAvailable()){window.HisaabSync.signOut();SYNC.on=false;SYNC.user=null;store('hisaab:sync',false);renderOverlay(false);ping('Signed out \u00b7 sync paused');}break;

    case 'cf-no': S.confirm=null;renderOverlay(false);break;
    case 'cf-yes': {var cc=S.confirm;S.confirm=null;if(cc)doConfirmed(cc);break}

    case 'trash-restore':
      if(restoreEntry(v)){renderAll();ping('Entry restored');}break;
    case 'trash-purge':
      S.confirm={title:'Delete for good?',msg:'This entry can\u2019t be recovered afterwards, on either phone.',act:'trash-purge',val:v,label:'Delete forever'};
      renderOverlay(false);break;
    case 'trash-empty':
      S.confirm={title:'Empty the bin?',msg:'All '+TRASH.length+' deleted '+(TRASH.length===1?'entry':'entries')+' will be gone for good on both phones.',act:'trash-empty',val:null,label:'Empty bin'};
      renderOverlay(false);break;

    case 'export': exportFile();break;
    case 'import': {var f=document.getElementById('importer');if(f)f.click();break}
  }
});

function fieldEdit(ev){
  var t=ev.target;
  var rc=t.getAttribute&&t.getAttribute('data-recalc');
  if(rc){cardRecalc(rc);return}
  var f2=t.getAttribute&&t.getAttribute('data-f2');
  if(f2==='goldRate'){W.goldRate=numOf(t.value)||W.goldRate;saveW();renderApp();return}
  if(f2==='silverRate'){W.silverRate=numOf(t.value)||W.silverRate;saveW();renderApp();return}
  if(f2==='saleLot'&&S.wSheet){S.wSheet.lotId=t.value;renderOverlay(false);return}
  var f=t.getAttribute&&t.getAttribute('data-f');
  if(f&&S.sheet){
    S.sheet[f]=t.value;
    if(f==='unitId'){
      var u=findUnit(t.value);
      if(u&&Number(u.rent)>0&&!S.sheet.amt){S.sheet.amt=String(u.rent)}
      renderOverlay(false);
    }
  }
  if(t.id==='importer'&&t.files&&t.files[0])importFile(t.files[0]);
}
document.addEventListener('input',fieldEdit);
document.addEventListener('change',fieldEdit);
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  var map={'person-name':'person-add','newcat':'newcat-add','ps-name':'ps-save','us-rent':'us-save','cat-name':'cat-add'};
  var id=ev.target.id;
  if(map[id]){ev.preventDefault();var b=document.querySelector('[data-a="'+map[id]+'"]');if(b)b.click()}
});

if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})
}

pull();pullW();pruneTrash();applyTheme();renderAll();

// bring up cloud sync once the Firebase module has settled
(function initSync(tries){
  if(syncAvailable()){ syncStart(); renderOverlay(false); return; }
  if(window.HisaabSync&&window.HisaabSync.ready===false&&!window.HisaabSync.enabled){ return; }
  if(tries>40)return;
  setTimeout(function(){initSync(tries+1)},150);
})(0);
})();
</script>
